<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pha 2 - Web nói nghe 2 chiều</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; line-height: 1.4; }
    .row { margin-bottom: 10px; }
    input, select, button { font-size: 16px; padding: 8px; }
    input, select { width: 100%; box-sizing: border-box; }
    button { margin-right: 6px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 760px; }
    .status { padding: 10px; background: #f3f3f3; border-radius: 8px; white-space: pre-wrap; }
    textarea { width: 100%; height: 220px; box-sizing: border-box; font-family: monospace; }
    .hint { color: #444; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Web bridge 2 chiều</h2>
  <div class="grid">
    <div class="row">
      <label>Session ID</label>
      <input id="sessionId" value="call-test" />
    </div>
    <div class="row">
      <label>WS URL</label>
      <input id="wsUrl" value="ws://192.168.1.100:8081/ws" />
    </div>
    <div class="row">
      <label>Playback sample rate</label>
      <select id="playRate">
        <option value="8000" selected>8000</option>
        <option value="16000">16000</option>
        <option value="44100">44100</option>
        <option value="48000">48000</option>
      </select>
    </div>
    <div class="row">
      <button id="btnConnect">Kết nối</button>
      <button id="btnDisconnect">Ngắt</button>
      <button id="btnMic">Bật mic web</button>
      <button id="btnMuteMic">Tắt mic web</button>
    </div>
    <div class="status" id="status">Chưa kết nối</div>
    <div class="hint">
      Bên dt1 đặt URL realtime trong BCR là: <b>ws://IP-MAY-TINH:8081/ws?session=&lt;session-id&gt;</b><br>
      Web và dt1 phải dùng cùng Session ID.
    </div>
    <textarea id="log" readonly></textarea>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logEl = $('log');
  const statusEl = $('status');
  const sessionEl = $('sessionId');
  const wsUrlEl = $('wsUrl');
  const playRateEl = $('playRate');

  let ws = null;
  let audioCtx = null;
  let nextPlayTime = 0;
  let micStream = null;
  let micSource = null;
  let micProcessor = null;
  let sendMicEnabled = false;

  function log(msg) {
    const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.value += line + "\n";
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function currentWsUrl() {
    const base = wsUrlEl.value.trim().replace(/\/$/, '');
    const session = encodeURIComponent(sessionEl.value.trim());
    return `${base}?session=${session}`;
  }

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      nextPlayTime = audioCtx.currentTime;
    }
    return audioCtx;
  }

  function pcm16ToFloat32(int16) {
    const out = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) {
      out[i] = Math.max(-1, Math.min(1, int16[i] / 32768));
    }
    return out;
  }

  function playPcm16(arrayBuffer) {
    const ctx = ensureAudio();
    const input = new Int16Array(arrayBuffer);
    const floatData = pcm16ToFloat32(input);
    const sampleRate = Number(playRateEl.value || 8000);
    const audioBuffer = ctx.createBuffer(1, floatData.length, sampleRate);
    audioBuffer.getChannelData(0).set(floatData);

    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(ctx.destination);

    const now = ctx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now + 0.02;
    source.start(nextPlayTime);
    nextPlayTime += audioBuffer.duration;
  }

  function downsampleToInt16(float32Samples, inputRate, targetRate) {
    if (targetRate >= inputRate) {
      const out = new Int16Array(float32Samples.length);
      for (let i = 0; i < float32Samples.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Samples[i]));
        out[i] = s < 0 ? s * 32768 : s * 32767;
      }
      return out;
    }

    const ratio = inputRate / targetRate;
    const newLength = Math.round(float32Samples.length / ratio);
    const result = new Int16Array(newLength);
    let offsetResult = 0;
    let offsetBuffer = 0;

    while (offsetResult < result.length) {
      const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
      let accum = 0;
      let count = 0;
      for (let i = offsetBuffer; i < nextOffsetBuffer && i < float32Samples.length; i++) {
        accum += float32Samples[i];
        count++;
      }
      const sample = count ? accum / count : 0;
      const s = Math.max(-1, Math.min(1, sample));
      result[offsetResult] = s < 0 ? s * 32768 : s * 32767;
      offsetResult++;
      offsetBuffer = nextOffsetBuffer;
    }

    return result;
  }

  async function enableMic() {
    ensureAudio();
    if (sendMicEnabled) return;

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
      }
    });

    const ctx = ensureAudio();
    await ctx.resume();

    micSource = ctx.createMediaStreamSource(micStream);
    micProcessor = ctx.createScriptProcessor(2048, 1, 1);

    micProcessor.onaudioprocess = (event) => {
      if (!sendMicEnabled || !ws || ws.readyState !== WebSocket.OPEN) return;
      const input = event.inputBuffer.getChannelData(0);
      const pcm = downsampleToInt16(input, ctx.sampleRate, 8000);
      ws.send(pcm.buffer);
    };

    micSource.connect(micProcessor);
    micProcessor.connect(ctx.destination);
    sendMicEnabled = true;
    log('Mic web đã bật, đang gửi PCM16 8k mono');
  }

  function disableMic() {
    sendMicEnabled = false;
    if (micProcessor) {
      try { micProcessor.disconnect(); } catch (_) {}
      micProcessor.onaudioprocess = null;
      micProcessor = null;
    }
    if (micSource) {
      try { micSource.disconnect(); } catch (_) {}
      micSource = null;
    }
    if (micStream) {
      for (const track of micStream.getTracks()) track.stop();
      micStream = null;
    }
    log('Mic web đã tắt');
  }

  function connect() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    const url = currentWsUrl();
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      setStatus('Đã kết nối');
      log(`WS open: ${url}`);
      ws.send(JSON.stringify({
        type: 'hello',
        role: 'web',
        session: sessionEl.value.trim(),
      }));
    };

    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'ping') {
            ws.send(JSON.stringify({ type: 'pong', session: sessionEl.value.trim(), ts: Date.now() }));
          }
          log(`CTRL ${event.data}`);
        } catch (_) {
          log(`TEXT ${event.data}`);
        }
        return;
      }
      playPcm16(event.data);
    };

    ws.onclose = (ev) => {
      setStatus(`Đã ngắt: ${ev.code} ${ev.reason || ''}`);
      log(`WS close code=${ev.code} reason=${ev.reason || ''}`);
    };

    ws.onerror = () => {
      setStatus('Lỗi WebSocket');
      log('WS error');
    };
  }

  function disconnect() {
    disableMic();
    if (ws) {
      try { ws.close(1000, 'manual disconnect'); } catch (_) {}
      ws = null;
    }
    setStatus('Đã ngắt');
  }

  $('btnConnect').onclick = connect;
  $('btnDisconnect').onclick = disconnect;
  $('btnMic').onclick = async () => {
    try {
      await enableMic();
    } catch (e) {
      log(`Không bật được mic: ${e.message}`);
    }
  };
  $('btnMuteMic').onclick = disableMic;
})();
</script>
</body>
</html>
