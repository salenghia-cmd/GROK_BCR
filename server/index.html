<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAN Call Listener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #f6f7fb;
      color: #111;
    }
    .box {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
    }
    .row {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, button, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .status {
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-top: 10px;
    }
    .ok { background: #e8fff0; color: #0a7a34; }
    .bad { background: #fff1f1; color: #c62828; }
    .warn { background: #fff9e8; color: #8a6500; }
    .mono {
      font-family: Consolas, monospace;
      word-break: break-all;
    }
    #log {
      height: 220px;
      overflow: auto;
      background: #0e1116;
      color: #d7e0ea;
      border-radius: 10px;
      padding: 12px;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .small {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Nghe audio từ dt1 qua Wi-Fi</h1>

    <div class="row">
      <label>Session</label>
      <input id="sessionId" value="default" />
    </div>

    <div class="row">
      <label>Sample rate PCM từ BCR</label>
      <select id="sampleRate">
        <option value="8000">8000 Hz</option>
        <option value="16000" selected>16000 Hz</option>
        <option value="44100">44100 Hz</option>
        <option value="48000">48000 Hz</option>
      </select>
      <div class="small">
        Nếu nghe nhanh/chậm hoặc méo tiếng thì đổi sample rate.
      </div>
    </div>

    <div class="row">
      <label>URL nghe</label>
      <input id="listenUrl" class="mono" readonly />
    </div>

    <div class="row">
      <label>URL BCR bên dt1 phải trỏ tới</label>
      <input id="producerUrl" class="mono" readonly />
    </div>

    <div class="btns">
      <button id="connectBtn">Kết nối nghe</button>
      <button id="disconnectBtn">Ngắt kết nối</button>
    </div>

    <div id="status" class="status warn">Chưa kết nối</div>

    <div class="row" style="margin-top: 14px;">
      <label>Nhật ký</label>
      <div id="log"></div>
    </div>
  </div>

  <script>
    const sessionInput = document.getElementById('sessionId');
    const sampleRateSelect = document.getElementById('sampleRate');
    const listenUrlInput = document.getElementById('listenUrl');
    const producerUrlInput = document.getElementById('producerUrl');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';

    let ws = null;
    let audioCtx = null;
    let gainNode = null;
    let nextPlayTime = 0;
    let keepAliveTimer = null;

    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log(line);
    }

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = `status ${type}`;
    }

    function getSession() {
      return (sessionInput.value || 'default').trim() || 'default';
    }

    function buildListenUrl() {
      return `${wsProto}://${location.host}/listen?session=${encodeURIComponent(getSession())}`;
    }

    function buildProducerUrl() {
      return `${wsProto}://${location.host}/out?session=${encodeURIComponent(getSession())}`;
    }

    function refreshUrls() {
      listenUrlInput.value = buildListenUrl();
      producerUrlInput.value = buildProducerUrl();
    }

    async function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 1.0;
        gainNode.connect(audioCtx.destination);
        nextPlayTime = 0;
      }

      if (audioCtx.state !== 'running') {
        await audioCtx.resume();
      }
    }

    function playPcm16Mono(arrayBuffer) {
      if (!audioCtx) return;

      const inputRate = parseInt(sampleRateSelect.value, 10) || 16000;
      const dataView = new DataView(arrayBuffer);
      const sampleCount = Math.floor(arrayBuffer.byteLength / 2);

      if (sampleCount <= 0) return;

      const audioBuffer = audioCtx.createBuffer(1, sampleCount, inputRate);
      const channel = audioBuffer.getChannelData(0);

      for (let i = 0; i < sampleCount; i++) {
        const s = dataView.getInt16(i * 2, true);
        channel[i] = s / 32768;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(gainNode);

      const now = audioCtx.currentTime;
      if (nextPlayTime < now + 0.05) {
        nextPlayTime = now + 0.05;
      }

      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;

      source.onended = () => {
        try {
          source.disconnect();
        } catch (_) {}
      };
    }

    async function connect() {
      try {
        await ensureAudio();
      } catch (e) {
        setStatus('Không bật được audio trên trình duyệt', 'bad');
        log(`Lỗi audio: ${e.message}`);
        return;
      }

      disconnect(false);
      refreshUrls();

      ws = new WebSocket(buildListenUrl());
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        setStatus('Đã kết nối listener', 'ok');
        log(`Đã kết nối: ${buildListenUrl()}`);
        log(`BCR bên dt1 phải nối tới: ${buildProducerUrl()}`);

        keepAliveTimer = setInterval(() => {
          try {
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send('PING');
            }
          } catch (_) {}
        }, 10000);
      };

      ws.onmessage = async (event) => {
        if (typeof event.data === 'string') {
          log(`TEXT: ${event.data}`);
          return;
        }

        if (event.data instanceof ArrayBuffer) {
          playPcm16Mono(event.data);
          return;
        }

        if (event.data instanceof Blob) {
          const buf = await event.data.arrayBuffer();
          playPcm16Mono(buf);
          return;
        }
      };

      ws.onclose = (e) => {
        setStatus(`Đã ngắt kết nối (${e.code})`, 'warn');
        log(`Socket đóng. code=${e.code} reason=${e.reason || ''}`);
        if (keepAliveTimer) {
          clearInterval(keepAliveTimer);
          keepAliveTimer = null;
        }
      };

      ws.onerror = () => {
        setStatus('Lỗi WebSocket', 'bad');
        log('WebSocket lỗi. Kiểm tra IP LAN, firewall, session, và server.');
      };
    }

    function disconnect(showLog = true) {
      if (keepAliveTimer) {
        clearInterval(keepAliveTimer);
        keepAliveTimer = null;
      }

      if (ws) {
        try {
          ws.close();
        } catch (_) {}
        ws = null;
      }

      nextPlayTime = 0;

      if (showLog) {
        setStatus('Đã ngắt kết nối', 'warn');
        log('Đã ngắt kết nối thủ công.');
      }
    }

    sessionInput.addEventListener('input', refreshUrls);
    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', () => disconnect(true));

    refreshUrls();
    log(`Mở trang bằng IP LAN, ví dụ: http://192.168.1.100:8081`);
  </script>
</body>
</html>
